<style>
/* Endgame Flashcards palette: the same wood board colors as your other
   chess sites — walnut #3b2416 · maple #f0d9b5 · board brown #b58863 */
:root {
    --cover-text-color:#f0d9b5;
    --cover-title-and-description-guard-bg-color: rgba(30,18,10,.72);
    --cover-title-text-shadow: none;

    --highlight:#f0d9b5;
    --highlight-contrast:#3b2416;
    --highlight-inverse:#2f6b3a;
    --highlight-inverse-contrast:#f0d9b5;

    --sticky-menu-text-color:#b58863;

    --section-light-bg-color:#f0d9b5;
    --section-light-text-color:#3b2416;
    --section-dark-bg-color:#3b2416!important;
    --section-dark-text-color:#f0d9b5!important;
    --section-uni-quote:#8a6448;
    --section-uni-code-bg-color:#e6c99c;

    --footer-color-background:#24160d;
    --footer-color:#c9a882;

    --ul-li-icon: ;
}
.blog-title, .blog-description { color:#f0d9b5 !important; }
.title-and-description-guard { border:1px solid rgba(181,136,99,.55); }
#site-head .btn.site-menu { border:none; }
.post-content a { text-decoration-color:#b58863; text-underline-offset:3px; }
.post-content a:hover { color:#2f6b3a; }
.post-holder.dark .post-content a:hover { color:#9cc9a3; }
.fixed-nav a.fn-item.active { color:#2f6b3a; }
.post-content h2 { font-size: 1.45em; margin-top: 1.6em; scroll-margin-top: 72px; }
.post-title { margin-bottom: 0.4em; }

/* sub menu: categories within a group */
.submenu { display:flex; flex-wrap:wrap; gap:8px; margin:1.1em 0 1.6em; }
.submenu .sub-item { display:inline-block; padding:7px 14px; border-radius:999px; font-size:.82em; line-height:1.3;
  text-decoration:none !important; border:1.5px solid #3b2416; }
.submenu .ready { background:#3b2416; color:#f0d9b5 !important; }
.submenu .ready:hover, .submenu .ready:focus-visible { background:#2f6b3a; border-color:#2f6b3a; color:#f0d9b5 !important; }
.submenu .ready:focus-visible { outline:3px solid #2f6b3a; outline-offset:2px; }
.submenu .soon { color:#3b2416; opacity:.5; border-style:dashed; cursor:default; }
.post-holder.dark .submenu .sub-item { border-color:#f0d9b5; }
.post-holder.dark .submenu .ready { background:#f0d9b5; color:#3b2416 !important; }
.post-holder.dark .submenu .soon { color:#f0d9b5; }

/* keep chess notation as written (1.e4, Qh5) instead of ALL CAPS */
#site-head .btn.site-menu, .fixed-nav a.fn-item { text-transform:none !important; letter-spacing:.02em; }
#site-head .btn.site-menu { font-size:1.05em; }

/* ---------- phones & tablets ---------- */
@media only screen and (max-width: 1130px) {
  .fixed-nav {
    flex-wrap: nowrap !important; justify-content: flex-start; align-items: center; gap: 6px;
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    padding: 8px 10px !important; background: #3b2416 !important; box-shadow: 0 2px 8px rgba(0,0,0,.25);
    box-sizing: border-box;
  }
  .fixed-nav::-webkit-scrollbar { display: none; }
  a.fn-item {
    display: inline-block !important; flex: 0 0 auto; margin: 0 !important;
    padding: 9px 14px; border-radius: 999px; white-space: nowrap;
    font-size: 15px; line-height: 1.2; letter-spacing: .02em;
    color: #f0d9b5 !important; background: rgba(240,217,181,.12); opacity: .9;
  }
  a.fn-item.active { background: #f0d9b5; color: #3b2416 !important; opacity: 1; }
  .post-holder .post { scroll-margin-top: 64px; }
  #site-head .btn.site-menu { padding: 10px 16px; margin: 5px 3px; font-size: 15px; }
  #site-head .blog-title { font-size: 3.4rem; }
  #site-head .blog-description { font-size: 1.9rem; }
  .submenu { gap:7px; }
  .submenu .sub-item { padding:8px 13px; font-size:14px; }
}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var nav = document.querySelector('.fixed-nav'); if (!nav) return; var last = null;
  window.addEventListener('scroll', function () {
    var a = nav.querySelector('.fn-item.active'); if (!a || a === last || nav.scrollWidth <= nav.clientWidth) return; last = a;
    nav.scrollTo({ left: a.offsetLeft - (nav.clientWidth - a.offsetWidth) / 2, behavior: 'smooth' });
  }, { passive: true });
});
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<link rel="stylesheet" href='{{ "css/flashcard.css" | relURL }}'>
<script src='{{ "js/flashcard.js" | relURL }}' defer></script>
